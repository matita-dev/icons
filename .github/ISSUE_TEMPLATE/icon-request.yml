name: Icon request
description: Ask for a new glyph
title: "[icon] "
labels: ["icon request"]
body:
  - type: input
    id: name
    attributes:
      label: Icon name
      description: A short, descriptive kebab-case name.
      placeholder: e.g. bookmark
    validations:
      required: true
  - type: textarea
    id: use
    attributes:
      label: What is it for?
      description: Where you'd use it, and what it should communicate.
    validations:
      required: true
  - type: textarea
    id: sketch
    attributes:
      label: Sketch or reference (optional)
      description: A drawing, screenshot, or a draft definition in the src/defs.js format.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing icons and open requests.
          required: true

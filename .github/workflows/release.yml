name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest
      - name: Tag must match package.json version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($pkg)"
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm publish --provenance --access public
